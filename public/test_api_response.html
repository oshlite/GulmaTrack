<!DOCTYPE html>
<html>
<head>
    <title>Test API Response</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        pre { background: #f0f0f0; padding: 10px; overflow: auto; }
        .green { color: green; }
        .red { color: red; }
    </style>
</head>
<body>
    <h1>Test API Response - Wilayah Records</h1>
    <p>Testing: <code>GET /api/wilayah/records/16</code></p>
    
    <h2>Response:</h2>
    <div id="result"></div>
    
    <script>
        async function testAPI() {
            try {
                const response = await fetch('/api/wilayah/records/16?_t=' + Date.now());
                const data = await response.json();
                
                let html = '<pre>';
                html += '<span class="green">✅ API Response Status: ' + response.status + '</span>\n\n';
                
                if (data.features && data.features.length > 0) {
                    html += '<span class="green">✅ Total Features: ' + data.features.length + '</span>\n\n';
                    
                    // Check first 3 features
                    for (let i = 0; i < Math.min(3, data.features.length); i++) {
                        const feature = data.features[i];
                        const props = feature.properties;
                        
                        html += `\n<strong>Feature ${i}:</strong>\n`;
                        html += `  PG: ${props.PG}\n`;
                        html += `  FM: ${props.FM}\n`;
                        html += `  HASIL: ${props.HASIL || '<span class="red">MISSING</span>'}\n`;
                        html += `  UMUR_TNM: ${props.UMUR_TNM || '<span class="red">MISSING</span>'}\n`;
                        html += `  TNM_STS: ${props.TNM_STS || '<span class="red">MISSING</span>'}\n`;
                        html += `  AKTIVITAS: ${props.AKTIVITAS || '<span class="red">MISSING</span>'}\n`;
                        html += `  TANGGAL: ${props.TANGGAL || '<span class="red">MISSING</span>'}\n`;
                        html += `  TOTAL_TK: ${props.TOTAL_TK || '<span class="red">MISSING</span>'}\n`;
                        html += `  All keys: ${Object.keys(props).join(', ')}\n`;
                    }
                } else {
                    html += '<span class="red">❌ No features found</span>\n';
                }
                
                html += '</pre>';
                document.getElementById('result').innerHTML = html;
                
            } catch (error) {
                document.getElementById('result').innerHTML = '<pre class="red">Error: ' + error.message + '</pre>';
            }
        }
        
        testAPI();
    </script>
</body>
</html>
