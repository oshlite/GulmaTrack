<!DOCTYPE html>
<html>
<head>
    <title>Test Wilayah API with Period</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; background: #f5f5f5; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #fff; padding: 10px; border: 1px solid #ddd; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Test Wilayah API dengan Parameter Periode</h1>
    
    <div class="test-section">
        <h2>1. Test /api/wilayah/data dengan periode 2030/3/W3</h2>
        <button onclick="testWilayahData()">Test /api/wilayah/data</button>
        <pre id="result1">Click button to test...</pre>
    </div>
    
    <div class="test-section">
        <h2>2. Test /api/wilayah/stats/16 dengan periode 2030/3/W3</h2>
        <button onclick="testWilayahStats()">Test /api/wilayah/stats/16</button>
        <pre id="result2">Click button to test...</pre>
    </div>
    
    <div class="test-section">
        <h2>3. Test /api/wilayah/geojson/16 dengan periode 2030/3/W3</h2>
        <button onclick="testWilayahGeojson()">Test /api/wilayah/geojson/16</button>
        <pre id="result3">Click button to test...</pre>
    </div>

    <script>
        async function testWilayahData() {
            const url = '/api/wilayah/data?tahun=2030&bulan=3&minggu=3&_t=' + Date.now();
            console.log('Testing URL:', url);
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('Response:', data);
                
                // Find Wilayah 16
                const wil16 = data.data?.find(w => w.wilayah == 16);
                
                const output = {
                    url: url,
                    status: response.status,
                    import_log_id: data.import_log_id,
                    wilayah_16_data: wil16,
                    wilayah_16_total_tk: wil16?.total_tk,
                    wilayah_16_total_neto: wil16?.total_luas_netto,
                    wilayah_16_status_counts: wil16?.status_counts
                };
                
                document.getElementById('result1').textContent = JSON.stringify(output, null, 2);
            } catch (error) {
                document.getElementById('result1').textContent = 'Error: ' + error.message;
            }
        }
        
        async function testWilayahStats() {
            const url = '/api/wilayah/stats/16?tahun=2030&bulan=3&minggu=3&_t=' + Date.now();
            console.log('Testing URL:', url);
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('Response:', data);
                
                const output = {
                    url: url,
                    status: response.status,
                    data: data
                };
                
                document.getElementById('result2').textContent = JSON.stringify(output, null, 2);
            } catch (error) {
                document.getElementById('result2').textContent = 'Error: ' + error.message;
            }
        }
        
        async function testWilayahGeojson() {
            const url = '/api/wilayah/geojson/16?tahun=2030&bulan=3&minggu=3&_t=' + Date.now();
            console.log('Testing URL:', url);
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('Response:', data);
                
                // Count features with kategori
                const featuresWithKategori = data.features?.filter(f => f.properties.kategori).length || 0;
                const ringanCount = data.features?.filter(f => f.properties.kategori === 'Ringan').length || 0;
                const bersihCount = data.features?.filter(f => f.properties.kategori === 'Bersih').length || 0;
                
                const output = {
                    url: url,
                    status: response.status,
                    total_features: data.features?.length || 0,
                    features_with_kategori: featuresWithKategori,
                    ringan_count: ringanCount,
                    bersih_count: bersihCount,
                    first_3_features: data.features?.slice(0, 3).map(f => ({
                        seksi: f.properties.seksi,
                        kategori: f.properties.kategori,
                        total_tk: f.properties.total_tk,
                        tk_ha: f.properties.tk_ha,
                        neto: f.properties.neto
                    }))
                };
                
                document.getElementById('result3').textContent = JSON.stringify(output, null, 2);
            } catch (error) {
                document.getElementById('result3').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
